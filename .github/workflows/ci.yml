name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Makassar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: python manage.py test && python manage.py check
        working-directory: backend
      - run: npm test && npm run build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV_FILE: .env.ci
    steps:
      - uses: actions/checkout@v7
      - name: Configure production-mode container environment
        run: |
          python3 - <<'PYTHON'
          import json
          import secrets
          import subprocess
          from pathlib import Path
          subprocess.run(['python3', 'scripts/create_demo_password.py', '--output', '.demo-access.ci.json'], check=True)
          credentials = json.loads(Path('.demo-access.ci.json').read_text())
          Path('.env.ci').write_text(
              'DJANGO_DEBUG=false\n'
              f"DEMO_ACCESS_PASSWORD_SHA256={credentials['password_sha256']}\n"
              f'DJANGO_SECRET_KEY={secrets.token_urlsafe(48)}\n'
              'DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend\n'
          )
          PYTHON
      - run: docker compose config --quiet
      - name: Build and start both containers
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check frontend, static assets and proxied API
        run: python3 scripts/docker_smoke.py --password-file .demo-access.ci.json
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
